# Chevron-owned package: do not install Atom.
# Integration / package behavior is validated by builtbygio/chevron CI
# (bootstrap → build → smoke) when this package's pin is bumped there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  metadata:
    name: package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate package.json
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.name) throw new Error('missing name');
            if (!p.main && !p.private) console.warn('warning: no main');
            if (!p.repository || !String(p.repository).includes('builtbygio')) {
              throw new Error('repository must point at builtbygio');
            }
            if (!p.engines || !p.engines.chevron) {
              throw new Error('engines.chevron required');
            }
            console.log('ok', p.name, p.version, p.repository, p.engines);
          "
