name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate package.json
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.engines || !p.engines.chevron) {
              console.error('engines.chevron is required');
              process.exit(1);
            }
            console.log(p.name, p.version);
          "
