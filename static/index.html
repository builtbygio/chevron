<!DOCTYPE html>
<html>
<head>
  <!--
    CSP (Electron BP P1.1): page world has no Node; preload boots Atom.
    script-src keeps 'unsafe-eval' for legacy compile-cache / package eval paths
    still used by some grammars and community packages in the preload world
    (page scripts themselves are empty — see preload.js).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' chevron: data: blob:; img-src 'self' chevron: data: blob: https:; script-src 'self' 'unsafe-eval' chevron:; style-src 'self' 'unsafe-inline' chevron:; font-src 'self' chevron: data:; connect-src 'self' chevron: https: http: ws: wss:; media-src 'self' chevron: data: blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' chevron: data: blob: https: http:;">
  <!--
    App bootstrap runs from static/preload.js (Node-capable isolated world).
    Do not load index.js as a page script — with contextIsolation the page has no require().
  -->
</head>
<body tabindex="-1">
</body>
</html>
