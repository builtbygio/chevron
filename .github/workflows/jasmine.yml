name: Jasmine

# Full in-app Jasmine (script/test). Not a PR gate — #57.
# Nightly on master + manual dispatch. Linux x64 only.
on:
  schedule:
    # 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Comma-separated packageDependencies to test (ATOM_PACKAGES_TO_TEST).
          Empty runs everything, which has not completed inside the 240-minute
          cap on any recent nightly.
        type: string
        required: false
        default: ''

concurrency:
  group: jasmine-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_OZONE_PLATFORM_HINT: x11
  LIBGL_ALWAYS_SOFTWARE: '1'
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  jasmine-linux:
    name: Linux x64 ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Sharded because the single job never finished: every nightly before this
    # ran the full 240 minutes and was cancelled, so the suite produced no
    # result at all.
    #
    # Shards split the *testable* packages, not all of packageDependencies:
    # only 12 of 83 vendored packages currently ship a spec/ or test/ dir, so
    # eight shards left three jobs with nothing to run. Those empty jobs still
    # failed, because script/test refuses an empty selection.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core
          - packages-1
          - packages-2
          - packages-3
          - packages-4

    steps:
      - uses: actions/checkout@v5

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG=libasound2t64
          else
            ALSA_PKG=libasound2
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libxss-dev \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            "${ALSA_PKG}" \
            libgbm1 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxtst6 \
            xvfb \
            fakeroot \
            dpkg-dev

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json packageManager (pnpm@11.22.0) is the pin. `version: 11`
          # here fails action-setup with "Multiple versions of pnpm specified".
          run_install: false

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install setuptools
        run: python -m pip install --upgrade pip setuptools

      - name: Rewrite git ssh URLs to https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"

      - name: Resolve Electron version
        id: meta
        run: echo "electron=$(node -p "require('./package.json').electronVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries and headers
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ~/.cache/electron
            ~/.cache/node-gyp
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.electron }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
            electron-${{ runner.os }}-

      - name: Cache npm + node_modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
            node_modules
            script/node_modules
            cpm/node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'script/package-lock.json', 'cpm/package-lock.json') }}-e${{ steps.meta.outputs.electron }}
          restore-keys: |
            nm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Bootstrap
        run: ./script/bootstrap-modern --ci

      - name: Build (no distro packages)
        run: ./script/with-modern-env ./script/build --no-bootstrap

      # Split packageDependencies across the package shards. Deterministic
      # (sorted, strided) so a given package lands in the same shard run to run
      # and a failure is attributable.
      # Split only the packages that actually have specs. script/test skips a
      # package with no spec/ or test/ dir ("No test folder found"), so
      # striding across all of packageDependencies produced shards whose whole
      # workload was skipped — and an empty selection is a hard error.
      - name: Compute shard package list
        if: matrix.shard != 'core'
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const SHARDS = Number(process.env.PACKAGE_SHARDS);
            const pd = Object.keys(require('./package.json').packageDependencies || {}).sort();
            const idx = Number('${{ matrix.shard }}'.split('-')[1]) - 1;
            if (!Number.isInteger(idx) || idx < 0 || idx >= SHARDS) {
              throw new Error('shard index ' + idx + ' outside PACKAGE_SHARDS=' + SHARDS);
            }
            // Same lookup script/test uses, so the two cannot disagree.
            const testable = pd.filter(name =>
              ['spec', 'test'].some(sub =>
                fs.existsSync(path.join('node_modules', name, sub))
              )
            );
            const mine = testable.filter((_, i) => i % SHARDS === idx);
            console.log(
              'shard ${{ matrix.shard }}: ' + mine.length + ' of ' + testable.length +
              ' testable packages (' + pd.length + ' declared)'
            );
            if (mine.length) console.log('  ' + mine.join(', '));
            const out = process.env.GITHUB_ENV;
            fs.appendFileSync(out, 'SHARD_PACKAGES=' + mine.join(',') + '\n');
            fs.appendFileSync(out, 'SHARD_EMPTY=' + (mine.length ? 'false' : 'true') + '\n');
          "
        env:
          # Must equal the number of packages-N entries in the matrix above.
          # The step throws if a shard index falls outside it, so the two
          # cannot drift apart silently.
          PACKAGE_SHARDS: '4'

      # Nothing to do when a shard drew no testable packages. script/test
      # treats an empty selection as an error, so skip rather than fail.
      - name: Skip empty shard
        if: matrix.shard != 'core' && env.SHARD_EMPTY == 'true'
        run: echo "No testable packages in ${{ matrix.shard }}; nothing to run."

      - name: Full Jasmine (Xvfb)
        if: matrix.shard == 'core' || env.SHARD_EMPTY != 'true'
        env:
          CI: 'true'
          ATOM_RUN_CORE_TESTS: ${{ matrix.shard == 'core' && 'true' || 'false' }}
          ATOM_RUN_PACKAGE_TESTS: ${{ matrix.shard == 'core' && 'false' || 'true' }}
          # A dispatch `packages` input overrides the shard split entirely.
          ATOM_PACKAGES_TO_TEST: ${{ inputs.packages || env.SHARD_PACKAGES }}
          TEST_JUNIT_XML_ROOT: ${{ runner.temp }}/jasmine-junit
          # Kill a suite that hangs instead of letting it hold the job open to
          # the cap, and stop starting new suites with ~20 minutes to spare so
          # the summary and JUnit are still written. Both were the difference
          # between "cancelled, no output" and an attributable result.
          SPEC_SUITE_TIMEOUT_MS: '900000'
          SPEC_TOTAL_BUDGET_MS: '5700000'
        run: |
          mkdir -p "$TEST_JUNIT_XML_ROOT"
          xvfb-run -a ./script/with-modern-env ./script/test

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # Per-shard: four jobs uploading one name collides on upload-artifact v4+.
          name: jasmine-junit-linux-x64-${{ matrix.shard }}
          path: ${{ runner.temp }}/jasmine-junit
          if-no-files-found: warn
