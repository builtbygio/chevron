name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_core_tests:
        description: 'After bootstrap+build, also run script/test (expensive; experimental)'
        type: boolean
        default: false

# Least privilege for GITHUB_TOKEN (code scanning: actions/missing-workflow-permissions).
# publish-unsigned-preview sets contents: write on that job only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Electron binary cache is workspace-local (reliable for actions/cache).
# Do not silence npm loglevel — deprecations/peer warnings must stay visible.
# node-gyp headers use the default OS cache paths (not npm_config_devdir —
# modern npm treats unknown npm_config_* as errors/warnings).
env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  # vscode-ripgrep's postinstall hits api.github.com; unauthenticated 403s
  # on shared Mac runners. The default token is enough for public releases.
  GITHUB_TOKEN: ${{ github.token }}


jobs:
  # ---------------------------------------------------------------------------
  # Docs-only detector. Gates the five-platform build matrix so a markdown-only
  # change does not burn ~10 runner-hours proving that prose still compiles.
  #
  # Deliberately a job-level `if:` rather than workflow-level `paths-ignore`:
  #   - unit tests still run on docs changes (cheap, and catches doc-adjacent
  #     script edits),
  #   - a *skipped* job reports a conclusion to branch protection, whereas a
  #     workflow that never runs leaves required checks pending forever.
  #
  # Fails safe: anything it cannot determine (force-push, new branch, shallow
  # history, workflow_dispatch) is treated as "code changed" → full build.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          code=true   # fail safe: never skip a build we are unsure about

          case "${{ github.event_name }}" in
            pull_request)
              base='${{ github.event.pull_request.base.sha }}'
              head='${{ github.event.pull_request.head.sha }}'
              ;;
            push)
              base='${{ github.event.before }}'
              head='${{ github.sha }}'
              ;;
            *)
              base=''; head=''   # workflow_dispatch → always build
              ;;
          esac

          if [ -n "$base" ] && [ -n "$head" ] \
             && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" "$head")"
            echo "Changed files:"
            echo "$files"
            # Docs-only when no changed path falls outside docs/ or *.md.
            # Logic lives in script/ci/docs-only-changed.sh so it can be tested:
            # the previous inline `grep -qvE` under pipefail misread SIGPIPE as
            # "docs-only" once the file list was long enough.
            if [ "$(printf '%s\n' "$files" | ./script/ci/docs-only-changed.sh)" = "true" ]; then
              code=false
            fi
          else
            echo "No usable diff range; assuming code changed."
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "→ running full build matrix"
          else
            echo "→ docs-only change: skipping five-platform build matrix"
          fi

  # ---------------------------------------------------------------------------
  # Fast unit path — cpm + package-require-audit (no Electron package)
  # Full Jasmine (script/test) is not a default PR gate (audit #57):
  #   - nightly + manual: .github/workflows/jasmine.yml
  #   - opt-in on this workflow: dispatch run_full_core_tests or PR label "jasmine"
  # Always runs, including on docs-only changes.
  # ---------------------------------------------------------------------------
  unit-and-cpm:
    name: cpm + package-require-audit unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # This job never installs pnpm. setup-node otherwise sees
          # package.json packageManager and fails looking up `pnpm` for cache.
          package-manager-cache: false

      - name: Install cpm dependencies
        working-directory: cpm
        run: npm ci

      - name: Run cpm tests
        working-directory: cpm
        run: npm test
        env:
          # Live Pulsar hits are useful; allow skip if registry is down.
          CPM_SKIP_LIVE_REGISTRY: '0'

      # Root package.json must not be installed here (pulls natives like keytar).
      # Install dugite in an isolated prefix, then copy into workspace node_modules
      # so git-utility-host can require.resolve it via CHEVRON_APP_PATH.
      - name: Install dugite for git-utility-host integration
        run: |
          set -euo pipefail
          PREFIX="${RUNNER_TEMP}/dugite-only"
          mkdir -p "$PREFIX"
          cd "$PREFIX"
          npm init -y >/dev/null
          # dugite postinstall downloads GitHub release tarball — flaky (ECONNRESET).
          # Install JS first, then retry the binary fetch separately.
          npm install --ignore-scripts --no-package-lock dugite@1.110.0 tree-kill@1.2.2
          if [ -f node_modules/dugite/script/download-git.js ]; then
            ok=0
            for attempt in 1 2 3; do
              if (cd node_modules/dugite && node ./script/download-git.js); then
                ok=1
                break
              fi
              echo "WARNING: dugite git download attempt ${attempt} failed; retrying..."
              sleep $((attempt * 4))
            done
            if [ "$ok" -ne 1 ]; then
              echo "WARNING: dugite embedded git missing after retries; git-utility tests may skip or use PATH git."
            fi
          fi
          mkdir -p "${GITHUB_WORKSPACE}/node_modules"
          cp -a node_modules/. "${GITHUB_WORKSPACE}/node_modules/"
          node -e "console.log('dugite', require.resolve('dugite'))"

      - name: package-require-audit + legacy-transpile + utility-worker unit tests
        run: |
          node --test script/ci/package-require-audit.test.js
          node --test script/ci/legacy-transpile.test.js
          node --test script/ci/package-pin-policy.test.js
          node --test script/ci/patch-inventory.test.js
          node --test script/ci/baseline-1.1.0.test.js
          node --test script/ci/wave3-gates.test.js
          node --test script/ci/replace-in-files.test.js
          node --test script/ci/wave1-ipc-slice.test.js
          node --test script/ci/user-config-path.test.js
          node --test script/ci/symbols-view-lsp.test.js
          node --test script/ci/smoke-probe-syntax.test.js
          node --test script/ci/rg-search-args.test.js
          node --test script/ci/pty-ipc.test.js
          node --test script/ci/chevron-api-alias.test.js
          node --test script/ci/lsp-framing.test.js
          node --test script/ci/lsp-position.test.js
          node --test script/ci/lsp-inbound-position.test.js
          node --test script/ci/lsp-trust.test.js
          node --test script/ci/lsp-command-policy.test.js
          node --test script/ci/lsp-host-integration.test.js
          node --test script/ci/lsp-providers.test.js
          node --test script/ci/lsp-registry.test.js
          node --test script/ci/lsp-workspace-edit.test.js
          node --test script/ci/lsp-supervision.test.js
          node --test script/ci/lsp-diagnostics-service.test.js
          node --test script/ci/bootstrap-contract.test.js
          node --test script/ci/config-contract.test.js
          node --test script/ci/docs-only-filter.test.js
          node --test script/ci/dep-graph.test.js
          node --test script/ci/github-release-check.test.js
          node --test script/ci/sca-runtime.test.js
          node --test script/ci/packaging-policy.test.js
          node --test script/ci/custom-element-factory.test.js
          node --test script/ci/s4-ipc-slice.test.js
          node --test script/ci/rg-ipc.test.js
          node --test script/ci/search-engine.test.js
          node --test script/ci/crash-branding.test.js
          node --test script/ci/load-tree-sitter-language.test.js
          node --test script/ci/package-utility-worker.test.js
          node --test script/ci/git-utility-host-integration.test.js
          node --test script/ci/natives-fingerprint.test.js
          node --test script/ci/fs-ipc-roots.test.js
          node --test script/ci/find-packaged-app.test.js
          node --test script/ci/ensure-ripgrep.test.js
          node --test script/ci/deferred-startup-packages.test.js
          node --test script/ci/snapshot-startup-packages.test.js
          node --test script/ci/github-pr-mutations.test.js
          node --test script/ci/settings-view-openable.test.js
          node --test script/ci/lsp-host-concurrent-start.test.js
          node --test script/ci/lsp-host-parentport.test.js
          node --test script/ci/autocomplete-inflight-hide.test.js
          node --test script/ci/trust-view-contrast.test.js
          node --test script/ci/language-stack.test.js
          node --test script/ci/grammar-inventory.test.js
          node --test script/ci/no-atom-global.test.js
          node --test script/ci/spec-harness-globals.test.js
          node --test script/ci/no-apm.test.js
          node --test script/ci/no-coffee.test.js
          node --test script/ci/no-request.test.js
          node --test script/ci/win32-userdata-name.test.js
          node --test script/ci/package-id.test.js
          node --test script/ci/src-typescript-first.test.js
          node --test script/ci/uri-scheme.test.js
          node --test script/ci/no-atom-uri.test.js
          node --test script/ci/shell-commands.test.js
          node --test script/ci/reload-watcher-shutdown.test.js

  # ---------------------------------------------------------------------------
  # macOS — Intel x64 + Apple Silicon arm64
  # ---------------------------------------------------------------------------
  build-and-smoke-macos:
    name: macOS ${{ matrix.arch }} bootstrap, build & smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json packageManager (pnpm@11.22.0) is the pin. `version: 11`
          # here fails action-setup with "Multiple versions of pnpm specified".
          run_install: false

      - name: Use Node 24 (bootstrap host; app deps via pnpm)
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use Python 3.12 (setuptools provides distutils for node-gyp)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install setuptools (distutils for node-gyp)
        run: python -m pip install --upgrade pip setuptools

      - name: Rewrite git ssh URLs to https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"

      - name: Resolve Electron version
        id: meta
        run: echo "electron=$(node -p "require('./package.json').electronVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries and headers
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ~/Library/Caches/node-gyp
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ steps.meta.outputs.electron }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-
            electron-${{ runner.os }}-

      - name: Cache npm + node_modules (enables native rebuild skip)
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
            node_modules
            script/node_modules
            cpm/node_modules
          key: nm-${{ runner.os }}-${{ matrix.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'script/package-lock.json', 'cpm/package-lock.json') }}-e${{ steps.meta.outputs.electron }}
          restore-keys: |
            nm-${{ runner.os }}-${{ matrix.arch }}-node24-

      - name: Bootstrap
        run: ./script/bootstrap-modern --ci

      - name: Build
        run: ./script/with-modern-env ./script/build --no-bootstrap --compress-artifacts

      - name: Launch smoke test
        run: node script/ci/smoke-test.js

      - name: Upload macOS packages
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: chevron-macos-${{ matrix.arch }}
          path: |
            out/*.zip
            out/*.app
          if-no-files-found: warn

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-state-macos-${{ matrix.arch }}
          path: |
            out/startup.js
            ${{ github.workspace }}/npm-debug.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Linux x64 — deb + tar + rpm
  # ---------------------------------------------------------------------------
  build-and-smoke-linux:
    name: Linux x64 bootstrap, build, smoke & packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v5

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          # Drop flaky third-party apt mirrors (e.g. Google Chrome) that break
          # index updates when mid-sync (unexpected Packages.gz size).
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          # Ubuntu 24.04+ uses t64 transitional ALSA package names
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG=libasound2t64
          else
            ALSA_PKG=libasound2
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libxss-dev \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            "${ALSA_PKG}" \
            libgbm1 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxtst6 \
            xvfb \
            fakeroot \
            dpkg-dev \
            rpm

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json packageManager (pnpm@11.22.0) is the pin. `version: 11`
          # here fails action-setup with "Multiple versions of pnpm specified".
          run_install: false

      - name: Use Node 24 (bootstrap host; app deps via pnpm)
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install setuptools (distutils for node-gyp)
        run: python -m pip install --upgrade pip setuptools

      - name: Rewrite git ssh URLs to https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"

      - name: Resolve Electron version
        id: meta
        run: echo "electron=$(node -p "require('./package.json').electronVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries and headers
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ~/.cache/electron
            ~/.cache/node-gyp
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.electron }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
            electron-${{ runner.os }}-

      - name: Cache npm + node_modules (enables native rebuild skip)
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
            node_modules
            script/node_modules
            cpm/node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'script/package-lock.json', 'cpm/package-lock.json') }}-e${{ steps.meta.outputs.electron }}
          restore-keys: |
            nm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Bootstrap
        run: ./script/bootstrap-modern --ci

      # Needs a real node_modules: it walks the installed builtbygio pins.
      # Cannot live in unit-and-cpm, which never runs a root `npm ci`.
      - name: Owned packages require chevron, not atom
        run: node --test script/ci/owned-require-chevron.test.js

      # These walk installed pins / settings-view copy. unit-and-cpm has no root install.
      - name: Task callers, pin CSON, One Dark settings-view copy
        run: |
          node --test script/ci/task-callers.test.js
          node --test script/ci/pin-cson.test.js
          node --test script/ci/chevron-dark-themes.test.js
          node --test script/ci/theme-migration.test.js
          node --test script/ci/package-requires-resolve.test.js
          node --test script/ci/accumulator-relay-prop.test.js
          node --test script/ci/theme-custom-properties.test.js
          node --test script/ci/theme-variables-eliminated.test.js
          node --test script/ci/temp-dir-hygiene.test.js
          node --test script/ci/ci-runs-every-test.test.js
          node --test script/ci/keymap-vendored.test.js
          node --test script/ci/bundled-packages.test.js
          node --test script/ci/cpm-caller-flags.test.js
          node --test script/ci/no-shipped-language-servers.test.js
          node --test script/ci/no-dev-tooling-in-installer.test.js
          node --test script/ci/service-hub.test.js

      # These need a real node_modules: github-8b reads node_modules/github,
      # lsp-builtin-discover resolves servers out of it
      # requires event-kit and jasmine-node-coffee requires underscore /
      # jasmine-node. unit-and-cpm never installs the root package.json.
      - name: Installed pin contracts (github 8B, LSP discovery, first-mate)
        run: |
          node --test script/ci/github-8b.test.js
          node --test script/ci/lsp-builtin-discover.test.js
          node --test script/ci/lsp-late-registration.test.js
          node --test script/ci/package-profiler.test.js
          node --test script/ci/config-precedence.test.js
          node --test script/ci/lsp-workspace-symbols.test.js
          node --test script/ci/inlay-hints.test.js
          node --test script/ci/pty-host-integration.test.js
          node --test script/ci/change-proposal.test.js
          node --test script/ci/tasks.test.js
          node --test script/ci/enclosing-scopes.test.js
          node --test script/ci/jasmine-node-coffee.test.js
          node --test script/ci/patch-inventory.test.js
          node --test script/ci/wave3-gates.test.js
          node --test script/ci/menu-uri-openers.test.js

      - name: Build + package (deb, tar, rpm)
        run: |
          set -euo pipefail
          command -v rpmbuild
          ./script/with-modern-env ./script/build --no-bootstrap \
            --create-debian-package \
            --create-rpm-package \
            --compress-artifacts
          # Require deb + tar + rpm artifacts
          ls -la out/*.deb out/*.tar.gz out/*.rpm

      # Asserts on out/app, so it has to follow the build: no bundled package
      # ships .less, and no per-theme-pair compile cache is warmed.
      - name: Compiled stylesheet contract
        run: |
          node --test script/ci/compiled-styles.test.js
          node --test script/ci/user-stylesheet-compiles.test.js
          node --test script/ci/lsp-no-server-notice.test.js
          node --test script/ci/install-panel.test.js
          node --test script/ci/autocomplete-stale-marker.test.js
          node --test script/ci/package-main-resolution.test.js
          node --test script/ci/prebuild-archives.test.js
          node --test script/ci/find-clangd.test.js
          node --test script/ci/theme-variable-conversion.test.js
          node --test script/ci/nested-modules-preserved.test.js
          node --test script/ci/dependencies-fingerprint.test.js
          node --test script/ci/socket-cleanup.test.js

      - name: Launch smoke test (Xvfb)
        run: xvfb-run -a node script/ci/smoke-test.js

      - name: Full Jasmine (opt-in)
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.run_full_core_tests) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'jasmine'))
        env:
          CI: 'true'
          ATOM_RUN_CORE_TESTS: 'true'
          ATOM_RUN_PACKAGE_TESTS: 'true'
          ELECTRON_OZONE_PLATFORM_HINT: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          TEST_JUNIT_XML_ROOT: ${{ runner.temp }}/jasmine-junit
        run: |
          mkdir -p "$TEST_JUNIT_XML_ROOT"
          xvfb-run -a ./script/with-modern-env ./script/test

      - name: Upload Jasmine JUnit
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.run_full_core_tests) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'jasmine')))
        uses: actions/upload-artifact@v6
        with:
          name: jasmine-junit-linux-x64-opt-in
          path: ${{ runner.temp }}/jasmine-junit
          if-no-files-found: ignore

      - name: Upload Linux packages
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: chevron-linux-${{ runner.arch }}
          path: |
            out/*.deb
            out/*.rpm
            out/*.tar.gz
          if-no-files-found: error

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-state-linux-${{ runner.arch }}
          path: |
            out/startup.js
            ${{ github.workspace }}/npm-debug.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Linux arm64 — deb + tar + rpm
  # Bootstrap/build are hard gates. Smoke is soft-gated (Xvfb/renderer flakes)
  # so packaging regressions still fail the job (audit #65).
  # ---------------------------------------------------------------------------
  build-and-smoke-linux-arm64:
    name: Linux arm64 bootstrap, build, smoke & packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v5

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          # Same as x64: ignore flaky third-party apt mirrors on the image.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG=libasound2t64
          else
            ALSA_PKG=libasound2
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libxss-dev \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            "${ALSA_PKG}" \
            libgbm1 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxtst6 \
            xvfb \
            fakeroot \
            dpkg-dev \
            rpm

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json packageManager (pnpm@11.22.0) is the pin. `version: 11`
          # here fails action-setup with "Multiple versions of pnpm specified".
          run_install: false

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install setuptools
        run: python -m pip install --upgrade pip setuptools

      - name: Rewrite git ssh URLs to https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"

      - name: Resolve Electron version
        id: meta
        run: echo "electron=$(node -p "require('./package.json').electronVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries and headers
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ~/.cache/electron
            ~/.cache/node-gyp
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.electron }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
            electron-${{ runner.os }}-

      - name: Cache npm + node_modules (enables native rebuild skip)
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
            node_modules
            script/node_modules
            cpm/node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'script/package-lock.json', 'cpm/package-lock.json') }}-e${{ steps.meta.outputs.electron }}
          restore-keys: |
            nm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Bootstrap
        run: ./script/bootstrap-modern --ci

      - name: Build + package (deb, tar, rpm)
        run: |
          set -euo pipefail
          command -v rpmbuild
          ./script/with-modern-env ./script/build --no-bootstrap \
            --create-debian-package \
            --create-rpm-package \
            --compress-artifacts
          ls -la out/*.deb out/*.tar.gz out/*.rpm

      # Soft-gate only: historical Xvfb/renderer flakes before packages activate.
      # Build/package steps above remain hard failures.
      - name: Launch smoke test (Xvfb)
        id: arm64_smoke
        continue-on-error: true
        run: xvfb-run -a node script/ci/smoke-test.js

      - name: Upload Linux arm64 packages
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: chevron-linux-arm64
          path: |
            out/*.deb
            out/*.rpm
            out/*.tar.gz
          if-no-files-found: error

      - name: Note soft smoke failure
        if: steps.arm64_smoke.outcome == 'failure'
        run: |
          echo "::warning::Linux arm64 smoke failed (soft-gated). Packages still uploaded if build succeeded."

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-state-linux-arm64
          path: |
            out/startup.js
            ${{ github.workspace }}/npm-debug.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Windows x64 — bootstrap, build, smoke, zip artifact
  # ---------------------------------------------------------------------------
  build-and-smoke-windows:
    name: Windows x64 bootstrap, build, smoke & packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # windows-2022 ships VS 2022 that node-gyp detects reliably.
    # windows-latest currently has VS 18/2026 which older node-gyp mis-parses.
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        # bootstrap-modern / with-modern-env are bash; Git Bash is on the image.
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json packageManager (pnpm@11.22.0) is the pin. `version: 11`
          # here fails action-setup with "Multiple versions of pnpm specified".
          run_install: false

      - name: Use Node 24 (bootstrap host; app deps via pnpm)
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install setuptools (distutils for node-gyp)
        run: python -m pip install --upgrade pip setuptools

      # Put cl.exe / link.exe on PATH so node-gyp (including old v5) can compile.
      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rewrite git ssh URLs to https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"

      - name: Resolve Electron version
        id: meta
        shell: bash
        run: echo "electron=$(node -p "require('./package.json').electronVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries and headers
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ~/AppData/Local/electron
            ~/AppData/Local/node-gyp
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.electron }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
            electron-${{ runner.os }}-

      - name: Cache npm + node_modules (enables native rebuild skip)
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
            ~/AppData/Local/pnpm/store
            node_modules
            script/node_modules
            cpm/node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'script/package-lock.json', 'cpm/package-lock.json') }}-e${{ steps.meta.outputs.electron }}
          restore-keys: |
            nm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Bootstrap
        run: |
          # Windows-style path: apm.cmd spawns git via cmd.exe, not Git Bash.
          export GIT_EXEC_PATH="C:/Program Files/Git/mingw64/libexec/git-core"
          export PATH="/c/Program Files/Git/mingw64/libexec/git-core:/c/Program Files/Git/cmd:$PATH"
          ./script/bootstrap-modern --ci
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          GIT_EXEC_PATH: "C:/Program Files/Git/mingw64/libexec/git-core"

      - name: Build + package (zip)
        run: |
          export GIT_EXEC_PATH="C:/Program Files/Git/mingw64/libexec/git-core"
          export PATH="/c/Program Files/Git/mingw64/libexec/git-core:/c/Program Files/Git/cmd:$PATH"
          ./script/with-modern-env ./script/build --no-bootstrap --compress-artifacts
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          GIT_EXEC_PATH: "C:/Program Files/Git/mingw64/libexec/git-core"

      - name: Launch smoke test
        run: node script/ci/smoke-test.js

      # Architecture H1 PR 12: publish Windows cold-start numbers.
      # Same harness as docs/reference/startup-snapshot-plan.md (§4). Five cold homes.
      - name: Measure cold start
        run: node script/ci/measure-startup.js --runs 5 --json out/startup-windows.json

      - name: Upload startup measurement
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: startup-windows-x64
          path: out/startup-windows.json
          if-no-files-found: warn

      - name: Upload Windows packages
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: chevron-windows-${{ runner.arch }}
          path: |
            out/*.zip
          if-no-files-found: warn

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-state-windows-${{ runner.arch }}
          path: |
            out/startup.js
            ${{ github.workspace }}/npm-debug.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Tag v* → GitHub Release (UNSIGNED PREVIEW). Signing/notarization is later.
  # ---------------------------------------------------------------------------
  publish-unsigned-preview:
    name: Publish unsigned preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - unit-and-cpm
      - build-and-smoke-macos
      - build-and-smoke-linux
      - build-and-smoke-linux-arm64
      - build-and-smoke-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} unsigned preview
          prerelease: true
          generate_release_notes: true
          body: |
            **UNSIGNED PREVIEW.** These binaries are not codesigned or notarized.

            - macOS Gatekeeper / Windows SmartScreen will warn. That is expected.
            - In-app update checks open [GitHub Releases](https://github.com/builtbygio/chevron/releases); they do not silently install.
            - Product contract: owned catalog only; Phase S **Option C** (editor `sandbox: false`). See [docs/reference/releases.md](https://github.com/builtbygio/chevron/blob/master/docs/reference/releases.md).

            Update URL: https://github.com/builtbygio/chevron/releases
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.nupkg
