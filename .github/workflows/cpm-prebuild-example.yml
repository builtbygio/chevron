# Example workflow for package authors publishing Electron prebuilds for cpm.
# Prefer prebuildify (binaries inside the npm package under prebuilds/) +
# node-gyp-build install — not prebuild/prebuild-install.
# Copy into your package repo and adjust Electron version.
#
# Not run for the Chevron monorepo by default (workflow_dispatch only).

name: cpm prebuild example

on:
  workflow_dispatch:
  # release:
  #   types: [published]

jobs:
  # Preferred: build prebuildify artifacts for npm publish (all platforms).
  prebuildify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Adjust target to match Chevron package.json electronVersion
      - name: prebuildify for Electron
        shell: bash
        env:
          ELECTRON_VERSION: '43.1.0'
        run: |
          npx prebuildify --napi --strip \
            --target "electron@${ELECTRON_VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/

  # Optional: also emit a single .node for chevron.prebuilds URL hosting
  single-node-artifact:
    needs: prebuildify
    if: false # enable if you also host chevron.prebuilds URLs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Note
        run: echo "Publish npm tarball with merged prebuilds/ folder; see docs/orientation/cpm-prebuilds.md"
