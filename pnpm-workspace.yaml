packages:
  - 'packages/*'

# pnpm 11+ reads these from this file, not .npmrc.
# Hoisted layout matches the historical npm tree so copy-assets.js
# and phantom requires from bundled packages keep working.
nodeLinker: hoisted
shamefullyHoist: true
strictPeerDependencies: false

# Owned catalog packages still pull git-pinned natives/grammars
# (ls-archive, tree-sitter-less, …) as subdependencies.
blockExoticSubdeps: false
# Git pins run prepare/install during a raw `pnpm install`. Bootstrap uses
# --ignore-scripts and rebuilds Electron natives itself. Do not hard-fail
# when a git package wants a build script.
strictDepBuilds: false

# pnpm 11 applies these more reliably than nested npm `overrides` objects.
# Keep in sync with package.json "overrides".
overrides:
  nan: 2.28.0
  dompurify: 3.4.13
  marked: 4.3.0
  'dugite>tar': 7.5.21
  'tar@6': 7.5.21
  'tar@7': 7.5.21
  lodash: 4.18.0
  'minimatch@0': 3.1.4
  'minimatch@2': 3.1.4
  'minimatch@3': 3.1.4
  'brace-expansion@1': 1.1.18
  'brace-expansion@2': 2.1.4
  'js-yaml@3': 3.15.1
  'form-data@2': 2.5.6
  'form-data@3': 3.0.5
  'form-data@4': 4.0.5
  'semver@5': 5.7.2
  'semver@6': 6.3.1
  'nanoid@3': 3.3.18
  'undici@7': 7.29.0
  tmp: 0.2.7
  'serialize-javascript': 7.0.5
  fstream: 1.0.12
  growl: 1.10.5
  mout: 1.2.4
  'json5@0': 2.2.3
  'json5@1': 2.2.3
  'semver@4': 5.7.2
  'diff@1': 3.5.1
  'diff@2': 3.5.1
  'debug@0': 2.6.9
  'debug@2': 2.6.9
  image-size: 2.1.2
  moment: 2.30.1
  'node-fetch@2': 2.7.0
  shelljs: 0.8.5
  shell-quote: 1.9.0
  'minimist@0': 0.2.4
  'minimist@1': 1.2.8
  'tough-cookie@4': 4.1.4
  'cross-spawn@6': 6.0.6
  'cross-spawn@7': 7.0.6
  'ansi-regex@3': 3.0.1
  'ansi-regex@4': 4.1.1
  'qs@6': 6.14.1
  'image-size@1': 2.1.2
  'image-size@2': 2.1.2
  'ajv@6': 6.14.0
  'debug@3': 3.2.7
  'debug@4': 4.4.1
  'diff@3': 3.5.1
  'diff@5': 5.2.2
  # Patch removes got from dugite 1.110; '-' drops any leftover lockfile edge.
  'dugite>got': '-'
  # less@2 pulls the deprecated `request` stack. less-cache only needs render().
  less: 3.13.1
  # language-css pins 0.23.2 (CJS + prebuilds). Without this, pnpm hoists
  # 0.20.0 from tree-sitter-less/scss and CSS highlighting fails.
  'tree-sitter-css': 0.23.2
  # Force nested first-mate / spell-check onto the owned git pins (Electron 43).
  oniguruma: $oniguruma
  spellchecker: $spellchecker
  '@atom/fuzzy-native': '$@atom/fuzzy-native'
  '@atom/nsfw': '$@atom/nsfw'
  ctags: $ctags
  git-utils: $git-utils
  keyboard-layout: $keyboard-layout
  keytar: $keytar
  nslog: $nslog
  pathwatcher: $pathwatcher
  'atom-pathspec': '$atom-pathspec'
  'atom-select-list': '$atom-select-list'
  'first-mate': '$first-mate'
  'fs-admin': '$fs-admin'
  'scrollbar-style': '$scrollbar-style'
  season: $season
  superstring: $superstring
  'text-buffer': '$text-buffer'

patchedDependencies:
  less@3.13.1: patches/less@3.13.1.patch
  dugite@1.110.0: patches/dugite@1.110.0.patch

# Owned catalog is published from this repo and consumed immediately.
# Default minimumReleaseAge (1 day) 404s just-published @builtbygio
# packages even when they are public.
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - '@builtbygio/*'
